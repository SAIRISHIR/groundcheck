# Runs Groundcheck's unit tests (the deterministic evidence checks) and
# builds the frontend on every push and pull request.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: groundcheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm --prefix static/app ci
      - run: npm --prefix static/app run build
